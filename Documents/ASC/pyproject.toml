# ─── Ruff — Linter + Formatter ────────────────────────────────────────────────
# Run:  ruff check backend/app/
#       ruff format backend/app/ --check
# ─────────────────────────────────────────────────────────────────────────────

[tool.ruff]
line-length    = 120
target-version = "py311"
src            = ["backend/app"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes (unused imports, undefined names)
    "I",    # isort (import ordering)
    "B",    # flake8-bugbear (likely bugs / bad practices)
    "C4",   # flake8-comprehensions (simplify comprehensions)
    "UP",   # pyupgrade (modern Python syntax)
    "S",    # flake8-bandit subset (basic security patterns)
    "RUF",  # Ruff-specific rules
]
ignore = [
    "E501",  # line-too-long — formatter handles this
    "B008",  # do not perform function calls in default args — FastAPI uses Depends()
    "B904",  # raise ... from ... inside except — too strict for now
    "S101",  # use of assert — allowed in production code (used in validators)
    "S105",  # hardcoded password string — false positive on config defaults
    "S106",  # hardcoded password funcarg — false positive on config defaults
    "UP007", # use X | Y instead of Optional — gradual migration
    "UP035", # deprecated imports — gradual migration
    "RUF012", # mutable class attributes — SQLAlchemy pattern
]

[tool.ruff.lint.per-file-ignores]
"backend/tests/**" = [
    "S101",  # assert statements are expected in tests
    "S105",  # hardcoded passwords expected in test fixtures
    "S106",  # hardcoded passwords expected in test fixtures
    "S108",  # /tmp paths in tests are OK
]
"backend/app/db/**" = [
    "S608",  # SQL injection — SQLAlchemy parametrized queries are safe
]

[tool.ruff.lint.isort]
known-first-party = ["app"]
force-single-line = false

[tool.ruff.format]
quote-style    = "double"
indent-style   = "space"
line-ending    = "lf"


# ─── Bandit — Python Security SAST ────────────────────────────────────────────
# Run:  bandit -r backend/app/ -c pyproject.toml --quiet
# ─────────────────────────────────────────────────────────────────────────────

[tool.bandit]
exclude_dirs = ["backend/tests", "backend/.venv", "backend/venv", ".venv"]
skips = [
    "B101",  # assert — common in production validators; not a security issue in this context
    "B105",  # hardcoded_password_string — false positive on Settings default values (overridden by .env)
    "B106",  # hardcoded_password_funcarg — false positive on DB URL defaults
]


# ─── Pytest ───────────────────────────────────────────────────────────────────
# Configuration in backend/pytest.ini (local) — these are shared defaults.
# ─────────────────────────────────────────────────────────────────────────────

[tool.pytest.ini_options]
asyncio_mode = "auto"
