[build-system]
requires = ["setuptools"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "specter-agent"
version = "1.0.0"
requires-python = ">=3.11"
dependencies = [
    "cryptography==43.0.3",
    "httpx==0.27.2",
    "psutil==6.0.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
