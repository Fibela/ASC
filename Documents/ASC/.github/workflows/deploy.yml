name: Deploy — ASC PremosCorp

# Triggered on push to master/main.
# Architecture: mono-deploy on Vercel (Next.js + FastAPI Lambda in asc-mono project).
# Vercel deploys automatically via git integration — no CLI deploy needed here.
# This workflow only runs the CI gate to block broken code from reaching production.
#
# Required GitHub Secrets (Settings → Secrets and variables → Actions):
#   VERCEL_TOKEN  — Vercel Dashboard → Settings → Tokens

on:
  push:
    branches: [main, master]

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:

# ─────────────────────────────────────────────────────────────────────────────
# JOB 1 — CI gate (tests must pass before Vercel auto-deploy goes live)
# ─────────────────────────────────────────────────────────────────────────────
  ci-check:
    name: CI Gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Gate de integridad asc_api (fuente única backend/asc_api)
        run: node scripts/sync-asc-api.mjs --check

      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            libmagic1 build-essential libpq-dev

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install Python dependencies
        working-directory: backend
        run: |
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Run tests with coverage gate
        working-directory: backend
        env:
          SECRET_KEY: ci-only-not-a-real-secret-key-change-in-prod
          DEBUG: "true"
        run: |
          pytest tests/ \
            --tb=short \
            --cov=asc_api \
            --cov-fail-under=85 \
            -q

# ─────────────────────────────────────────────────────────────────────────────
# JOB 2 — Deploy to Vercel (skipped if VERCEL_TOKEN not set)
# Vercel also deploys automatically via git integration — this job is an
# explicit trigger that can force a production deploy from CI if needed.
# ─────────────────────────────────────────────────────────────────────────────
  deploy-frontend:
    name: Deploy → Vercel
    runs-on: ubuntu-latest
    needs: [ci-check]
    if: ${{ secrets.VERCEL_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v4
      - name: Install Vercel CLI
        run: npm install -g vercel@latest
      - name: Deploy to Vercel production
        run: |
          vercel deploy --prod --token="${{ secrets.VERCEL_TOKEN }}" \
            --yes --cwd frontend
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}

# ─────────────────────────────────────────────────────────────────────────────
# JOB 3 — Gate: verify production is live post-deploy
# ─────────────────────────────────────────────────────────────────────────────
  deploy-gate:
    name: Deploy Gate
    runs-on: ubuntu-latest
    needs: [deploy-frontend]
    if: always()
    steps:
      - name: Health check → asc.premoscorp.com
        run: |
          sleep 30
          HTTP_CODE=$(curl -sf -o /dev/null -w "%{http_code}" \
            https://asc.premoscorp.com/api/v1/health/liveness || echo "000")
          echo "Health check HTTP $HTTP_CODE"
          if [ "$HTTP_CODE" != "200" ]; then
            echo "Health check failed — check Vercel deploy logs"
            exit 1
          fi
          echo "ASC PremosCorp is live"
