# ─── ASC PremosCorp — Render Blueprint (Fase 1 deployment) ────────────────────
#
# Declarative infrastructure-as-code for Render.com.
# Apply with: render deploy --yaml render.yaml
# Or: push to main with "Auto-Deploy" enabled in Render Dashboard.
#
# Reference: https://render.com/docs/blueprint-spec
#
# Environment variables marked sync:false must be set manually in the
# Render Dashboard (Settings → Environment) before the first deploy.
# ─────────────────────────────────────────────────────────────────────────────

services:

  # ── FastAPI Backend ──────────────────────────────────────────────────────────
  - type: web
    name: asc-backend
    runtime: python
    pythonVersion: "3.11"    # pydantic-core 2.23.4 has no wheel for 3.14 — pin to 3.11
    region: oregon           # closest to South America with free tier availability
    plan: free               # upgrade to 'starter' ($7/mo) to remove spin-down

    # Source
    rootDir: Documents/ASC/backend
    buildCommand: pip install --no-cache-dir -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT --workers 1

    # Render free tier: single worker required (multi-worker needs persistent disk)
    # In-memory rate limiting is sufficient at free-tier traffic volumes.

    # Health check — Render polls this to confirm the service is alive.
    # Maps to @app.get("/health") in main.py (no auth, returns {"status":"ok"}).
    healthCheckPath: /health

    # Auto-deploy on push to main
    autoDeploy: true

    envVars:
      # ── Python version pin (Render free tier defaults to latest = 3.14) ───
      - key: PYTHON_VERSION
        value: "3.11.9"

      # ── Required — set in Render Dashboard → Environment ──────────────────
      - key: SECRET_KEY
        sync: false                # Never committed — generate with: python -c "import secrets; print(secrets.token_hex(32))"

      - key: DATABASE_URL
        sync: false                # Supabase connection string (Session mode, port 5432)
                                   # Format: postgresql+asyncpg://postgres.[ref]:[pass]@aws-0-*.pooler.supabase.com:5432/postgres

      - key: CORS_ORIGINS
        value: '["https://premoscorp.com","https://www.premoscorp.com"]'

      # ── Optional — leave empty to disable integrations ─────────────────────
      - key: REDIS_URL
        value: ""                  # Empty = Celery in no-op mode (OK for Fase 1 / free tier)
                                   # Set to Upstash URL to enable Celery tasks

      - key: VIRUSTOTAL_API_KEY
        value: ""

      - key: ABUSEIPDB_API_KEY
        value: ""

      - key: OTXALIEN_API_KEY
        value: ""

      # ── Fixed values for Render ────────────────────────────────────────────
      - key: DEBUG
        value: "false"

      - key: ALERT_CRITICAL_THRESHOLD
        value: "0.85"

      - key: ALERT_HIGH_THRESHOLD
        value: "0.65"

      - key: ALERT_MEDIUM_THRESHOLD
        value: "0.40"

      - key: RATE_LIMIT_LOGIN
        value: "10/minute"

      - key: RATE_LIMIT_REGISTER
        value: "3/minute"

      - key: RATE_LIMIT_REFRESH
        value: "30/minute"

      - key: RATE_LIMIT_CHANGE_PASSWORD
        value: "10/minute"

      - key: REQUEST_MAX_BODY_BYTES
        value: "10485760"

      - key: SPECTER_STRICT_SIGNATURE_MODE
        value: "false"

      # ── P39 — Prometheus scraper token ────────────────────────────────────
      - key: METRICS_SCRAPE_TOKEN
        sync: false              # Static bearer token for /api/v1/observability/metrics
                                 # Empty = requires analyst+ JWT instead

      # ── P53 — Email Verification ──────────────────────────────────────────
      - key: EMAIL_VERIFICATION_EXPIRE_HOURS
        value: "24"              # Hours before email verification token expires

      # ── P55 — Stripe Billing (leave empty to disable) ─────────────────────
      - key: STRIPE_SECRET_KEY
        sync: false              # sk_live_… or sk_test_… — never committed
                                 # Empty = Stripe integration disabled
      - key: STRIPE_WEBHOOK_SECRET
        sync: false              # whsec_… from Stripe Dashboard → Webhooks → Signing secret
                                 # Empty = webhook signature validation skipped (dev only)

      # ── P60 — Stripe Checkout Auto-Provisioning ───────────────────────────
      - key: STRIPE_PROVISIONING_PLAN
        value: "pro"             # Plan assigned on checkout.session.completed (free|pro|enterprise)
      - key: STRIPE_SEGURIDAD_PRODUCT_ID
        value: ""                # Optional: restrict provisioning to this Stripe product ID
                                 # Empty = all checkout.session.completed events trigger provisioning

      # ── SPECTER Signing Keys (required in production) ─────────────────────
      - key: SPECTER_SIGNING_PRIVATE_KEY
        sync: false              # base64 raw Ed25519 private key (32 bytes)
                                 # Generate: python -c "from app.core.signing import generate_keypair; p,q=generate_keypair(); print('PRIVATE:',p)"
      - key: SPECTER_SIGNING_PUBLIC_KEY
        sync: false              # base64 raw Ed25519 public key (32 bytes)
                                 # Leave empty to disable command signing (dev/sandbox only)

      # ── Adapter credentials (all optional — empty = adapter disabled) ──────
      - key: PALOALTO_HOST
        value: ""
      - key: PALOALTO_API_KEY
        value: ""
      - key: FORTINET_HOST
        value: ""
      - key: FORTINET_API_TOKEN
        value: ""
      - key: AD_SERVER_URL
        value: ""
      - key: AD_BIND_DN
        value: ""
      - key: AD_BIND_PASSWORD
        value: ""
      - key: ELASTICSEARCH_URL
        value: ""
      - key: ELASTICSEARCH_API_KEY
        value: ""
      - key: WAZUH_URL
        value: ""
      - key: WAZUH_USERNAME
        value: ""
      - key: WAZUH_PASSWORD
        value: ""
      - key: THEHIVE_URL
        value: ""
      - key: THEHIVE_API_KEY
        value: ""

      # ── P59 — SSO Bridge: Supabase → ASC JWT ─────────────────────────────
      # SUPABASE_URL must be the project that signs tokens for premoscorp.com
      # (premoscorp_data = xdgilxcmvpxhrpbuqyrr, NOT ASC_BD = kqxwtayzqujlddviskwl)
      - key: SUPABASE_URL
        value: "https://xdgilxcmvpxhrpbuqyrr.supabase.co"
      - key: SUPABASE_JWT_SECRET
        sync: false              # JWT Secret from Supabase project Settings → API
                                 # Empty = SSO bridge returns 503
      - key: SUPABASE_JWT_AUDIENCE
        value: "authenticated"   # Expected aud claim in Supabase JWTs
      - key: SSO_DEFAULT_PLAN
        value: "free"            # Plan assigned to auto-provisioned SSO tenants

      # Render injects PORT automatically — do NOT set it here.
      # uvicorn binds to $PORT (set in startCommand above).
