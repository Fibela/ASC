## ASC PremosCorp — Render.com Blueprint
## Docs: https://render.com/docs/blueprint-spec
## Versión: 2.0 | 2026-07-12 | Sync completo con vars Vercel (backend subset)

services:
  - type: web
    name: asc-backend
    runtime: python
    buildCommand: cd backend && pip install -r requirements.txt
    startCommand: cd backend && uvicorn asc_api.main:app --host 0.0.0.0 --port $PORT --workers 1
    healthCheckPath: /health
    autoDeploy: true

    envVars:

      # ── Core ────────────────────────────────────────────────────────────────
      - key: APP_NAME
        value: "ASC PremosCorp"

      - key: APP_VERSION
        value: "5.0"

      - key: SECRET_KEY
        sync: false

      - key: DATABASE_URL
        sync: false

      - key: REDIS_URL
        sync: false

      - key: DEBUG
        value: "false"

      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "30"

      # ── CORS ────────────────────────────────────────────────────────────────
      - key: CORS_ORIGINS
        value: '["https://app.premoscorp.com","https://premoscorp.com","https://asc.premoscorp.com"]'

      - key: CORS_ORIGINS_EXTRA
        value: "https://www.premoscorp.com"

      # ── Email (Resend) ───────────────────────────────────────────────────────
      - key: RESEND_API_KEY
        sync: false

      - key: RESEND_FROM_EMAIL
        value: "noreply@premoscorp.com"

      - key: EMAIL_VERIFICATION_EXPIRE_HOURS
        value: "24"

      # ── Auth & Account ───────────────────────────────────────────────────────
      - key: ACCOUNT_LOCK_THRESHOLD
        value: "5"

      - key: ACCOUNT_LOCK_MINUTES
        value: "30"

      # ── Rate Limits ──────────────────────────────────────────────────────────
      - key: RATE_LIMIT_LOGIN
        value: "10/minute"

      - key: RATE_LIMIT_REGISTER
        value: "5/minute"

      - key: RATE_LIMIT_REFRESH
        value: "20/minute"

      - key: RATE_LIMIT_CHANGE_PASSWORD
        value: "5/minute"

      - key: RATE_LIMIT_ANALYZE_FILE
        value: "10/minute"

      - key: RATE_LIMIT_ANALYZE_LOOKUP
        value: "30/minute"

      - key: RATE_LIMIT_ALERTS
        value: "60/minute"

      - key: RATE_LIMIT_IOCS
        value: "60/minute"

      - key: RATE_LIMIT_OPS
        value: "30/minute"

      # ── Alert Thresholds ─────────────────────────────────────────────────────
      - key: ALERT_CRITICAL_THRESHOLD
        value: "0.85"

      - key: ALERT_HIGH_THRESHOLD
        value: "0.65"

      - key: ALERT_MEDIUM_THRESHOLD
        value: "0.40"

      # ── File Analysis ────────────────────────────────────────────────────────
      - key: MAX_FILE_SIZE_MB
        value: "50"

      - key: SANDBOX_TIMEOUT_SECONDS
        value: "30"

      # ── IoC & Reporting ──────────────────────────────────────────────────────
      - key: IOC_FEEDS_UPDATE_HOURS
        value: "6"

      - key: REPORT_COMPANY_NAME
        value: "PremosCorp"

      - key: REPORT_LOGO_PATH
        value: ""

      # ── Escalation ───────────────────────────────────────────────────────────
      - key: ESCALATION_CHECK_INTERVAL_SECONDS
        value: "300"

      - key: SLA_ESCALATION_CHECK_INTERVAL_SECONDS
        value: "60"

      # ── Stripe ──────────────────────────────────────────────────────────────
      - key: STRIPE_SECRET_KEY
        sync: false

      - key: STRIPE_WEBHOOK_SECRET
        sync: false

      - key: STRIPE_PROVISIONING_PLAN
        value: "pro"

      - key: STRIPE_PRICE_PRO
        value: ""

      - key: STRIPE_PRICE_ENTERPRISE
        value: ""

      - key: STRIPE_SEGURIDAD_PRODUCT_ID
        value: ""

      # ── SPECTER ─────────────────────────────────────────────────────────────
      - key: SPECTER_SIGNING_PRIVATE_KEY
        sync: false

      - key: SPECTER_SIGNING_PUBLIC_KEY
        value: ""

      - key: SPECTER_ENROLLMENT_SECRET
        sync: false

      - key: SPECTER_AGENT_VERSION
        value: "1.0.0"

      - key: SPECTER_INACTIVE_THRESHOLD_SECONDS
        value: "300"

      - key: SPECTER_MAX_EVENTS_PER_BATCH
        value: "100"

      - key: SPECTER_STRICT_SIGNATURE_MODE
        value: "false"

      - key: SPECTER_MAX_EVENTS_PER_WINDOW
        value: "1000"

      - key: SPECTER_RATE_WINDOW_SECONDS
        value: "60"

      # ── Observability ────────────────────────────────────────────────────────
      - key: METRICS_SCRAPE_TOKEN
        sync: false

      # ── Supabase & SSO ───────────────────────────────────────────────────────
      - key: SUPABASE_URL
        value: ""

      - key: SUPABASE_ANON_KEY
        sync: false

      - key: SUPABASE_SERVICE_KEY
        sync: false

      - key: SUPABASE_JWT_SECRET
        sync: false

      - key: SUPABASE_JWT_AUDIENCE
        value: "authenticated"

      - key: SSO_DEFAULT_PLAN
        value: "free"

      # ── Threat Intel ─────────────────────────────────────────────────────────
      - key: VIRUSTOTAL_API_KEY
        sync: false

      - key: ABUSEIPDB_API_KEY
        sync: false

      - key: OTXALIEN_API_KEY
        sync: false

      # ── Elasticsearch ────────────────────────────────────────────────────────
      - key: ELASTICSEARCH_URL
        value: ""

      - key: ELASTICSEARCH_API_KEY
        value: ""

      - key: ELASTICSEARCH_INDEX_ALERTS
        value: "asc-alerts"

      - key: ELASTICSEARCH_INDEX_EVENTS
        value: "asc-events"

      # ── Wazuh ────────────────────────────────────────────────────────────────
      - key: WAZUH_URL
        value: ""

      - key: WAZUH_USERNAME
        value: ""

      - key: WAZUH_PASSWORD
        sync: false

      - key: WAZUH_VERIFY_SSL
        value: "true"

      # ── TheHive ──────────────────────────────────────────────────────────────
      - key: THEHIVE_URL
        value: ""

      - key: THEHIVE_API_KEY
        sync: false

      - key: THEHIVE_ORGANISATION
        value: ""

      # ── Palo Alto Networks ───────────────────────────────────────────────────
      - key: PALOALTO_HOST
        value: ""

      - key: PALOALTO_API_KEY
        value: ""

      - key: PALOALTO_VSYS
        value: "vsys1"

      - key: PALOALTO_BLOCKED_IP_GROUP
        value: ""

      - key: PALOALTO_BLOCKED_URL_CATEGORY
        value: ""

      # ── Fortinet ─────────────────────────────────────────────────────────────
      - key: FORTINET_HOST
        value: ""

      - key: FORTINET_API_TOKEN
        value: ""

      - key: FORTINET_VDOM
        value: "root"

      - key: FORTINET_BLOCKED_IP_GROUP
        value: ""

      - key: FORTINET_BLOCKED_DOMAIN_GROUP
        value: ""

      # ── Active Directory / LDAP ──────────────────────────────────────────────
      - key: AD_SERVER_URL
        value: ""

      - key: AD_BIND_DN
        value: ""

      - key: AD_BIND_PASSWORD
        sync: false

      - key: AD_BASE_DN
        value: ""

      - key: AD_QUARANTINE_OU
        value: ""

      - key: AD_USE_SSL
        value: "true"

      - key: AD_VERIFY_CERT
        value: "true"
