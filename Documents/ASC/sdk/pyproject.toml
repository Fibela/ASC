[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "asc-premoscorp-sdk"
version = "0.1.0"
description = "Python SDK for the ASC PremosCorp SOC Platform"
license = { text = "Proprietary" }
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
]

[tool.hatch.build.targets.wheel]
packages = ["asc_sdk"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
