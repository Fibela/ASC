# ─── ASC PremosCorp — Nginx TLS + Security-Hardened Config ────────────────────
#
# Threat model: public-facing SOC portal at asc.premoscorp.com
#
# P10 — TLS Hardening additions:
#   [13] HTTP→HTTPS redirect (301)   — all plaintext requests upgraded
#   [14] ACME challenge passthrough  — Let's Encrypt cert renewal without downtime
#   [15] TLS 1.2 + 1.3 only         — TLS 1.0 and 1.1 explicitly disabled
#   [16] ECDHE + CHACHA20 ciphers   — forward secrecy, AEAD-only, no RC4/3DES
#   [17] ssl_session_tickets off    — per-session forward secrecy
#   [18] SSL session cache 10m      — performance without tickets
#   [19] HTTP/2 enabled             — multiplexed connections, HPACK compression
#   [20] HSTS max-age=31536000      — 1-year pin, includeSubDomains + preload
#
# P9 — Security protections (unchanged):
#   [1]  server_tokens off           — no nginx version disclosure
#   [2]  Content-Security-Policy     — prevents XSS + data exfiltration
#   [3]  X-Frame-Options: DENY       — prevents clickjacking
#   [4]  X-Content-Type-Options      — prevents MIME sniffing
#   [5]  Referrer-Policy             — limits referrer info leakage
#   [6]  Permissions-Policy          — disables dangerous browser APIs
#   [7]  Rate limiting (auth/api)    — brute force + credential stuffing
#   [8]  Blocked sensitive paths     — .env, .git, __pycache__, etc.
#   [9]  /docs + /redoc blocked      — API schema not public
#   [10] client_max_body_size 10m    — oversized payload protection
#   [11] Client/header timeouts      — Slowloris mitigation
#   [12] connect-src 'self' in CSP   — browser API calls stay on same origin
#
# Certificate paths:
#   Dev:  scripts/gen_selfsigned_cert.sh  (or .ps1 on Windows)
#   Prod: Let's Encrypt — see docs/TLS_SETUP.md
# ─────────────────────────────────────────────────────────────────────────────

worker_processes auto;
pid /tmp/nginx.pid;

events {
    worker_connections 1024;
    use epoll;
    multi_accept on;
}

http {
    # ── [1] Hide server identity ──────────────────────────────────────────────
    server_tokens off;

    include      /etc/nginx/mime.types;
    default_type application/octet-stream;

    sendfile    on;
    tcp_nopush  on;
    tcp_nodelay on;
    keepalive_timeout      65;
    keepalive_requests    100;
    types_hash_max_size  2048;

    # ── [10] Payload size limits ──────────────────────────────────────────────
    client_max_body_size       10m;
    client_body_buffer_size   128k;
    client_header_buffer_size   1k;
    large_client_header_buffers 4 4k;

    # ── [11] Timeouts (Slowloris mitigation) ──────────────────────────────────
    client_body_timeout    12s;
    client_header_timeout  12s;
    send_timeout           10s;

    # ── Gzip ─────────────────────────────────────────────────────────────────
    gzip on;
    gzip_vary on;
    gzip_disable "msie6";
    gzip_types text/plain text/css application/json application/javascript text/javascript application/xml;

    # ── [7] Rate limiting zones ───────────────────────────────────────────────
    # auth_limit: 5 req/min — login brute force protection
    limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=5r/m;
    # api_limit:  30 req/min — general API abuse protection
    limit_req_zone $binary_remote_addr zone=api_limit:10m  rate=30r/m;
    limit_req_status 429;

    # ── Upstreams ─────────────────────────────────────────────────────────────
    upstream backend {
        server backend:8000;
        keepalive 16;
    }
    upstream frontend {
        server frontend:3000;
        keepalive 16;
    }

    # ── Logging ───────────────────────────────────────────────────────────────
    log_format main '$remote_addr - $remote_user [$time_local] '
                    '"$request" $status $body_bytes_sent '
                    'rt=$request_time';
    access_log /var/log/nginx/access.log main;
    error_log  /var/log/nginx/error.log  warn;

    # ─────────────────────────────────────────────────────────────────────────
    # [13] HTTP → HTTPS redirect
    # All plaintext requests are upgraded to HTTPS with a permanent redirect.
    # Exception: ACME challenge path for Let's Encrypt cert issuance/renewal.
    # ─────────────────────────────────────────────────────────────────────────
    server {
        listen 80;
        server_name _;

        # [14] Let's Encrypt ACME — certbot writes challenge files here during
        # cert issuance/renewal. nginx serves them so the CA can verify domain.
        # Volume: ./infra/nginx/certbot-webroot:/var/www/certbot in docker-compose.
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        # Health check — bypasses HTTPS redirect intentionally.
        # Allows Docker's internal healthcheck (wget http://localhost/health) to
        # work without TLS. /health returns {"status":"ok"} — no sensitive data.
        location = /health {
            access_log off;
            proxy_pass         http://backend;
            proxy_set_header   Host $host;
            proxy_http_version 1.1;
        }

        # [13] All other traffic → HTTPS (permanent redirect)
        location / {
            return 301 https://$host$request_uri;
        }
    }

    # ─────────────────────────────────────────────────────────────────────────
    # HTTPS main server — all security headers applied here
    # ─────────────────────────────────────────────────────────────────────────
    server {
        listen 443 ssl;
        http2  on;
        server_name _;

        # ── [15] TLS certificates ─────────────────────────────────────────────
        # Dev:  scripts/gen_selfsigned_cert.sh → infra/nginx/certs/
        # Prod: Let's Encrypt fullchain.pem + privkey.pem
        ssl_certificate      /etc/nginx/certs/fullchain.pem;
        ssl_certificate_key  /etc/nginx/certs/privkey.pem;

        # ── [15] Protocol restriction — TLS 1.0 and 1.1 explicitly disabled ───
        ssl_protocols TLSv1.2 TLSv1.3;

        # ── [16] Cipher suite — ECDHE + AEAD only, no RC4 / 3DES / NULL ───────
        # All selected ciphers provide forward secrecy via ECDHE or DHE.
        # CHACHA20 included for mobile/low-power clients without AES acceleration.
        ssl_prefer_server_ciphers on;
        ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256';

        # ── [17][18] Session security ──────────────────────────────────────────
        # Session cache: shared across workers, 10m ≈ 40000 sessions
        # Session tickets disabled: each session gets independent key material
        # (forward secrecy is otherwise broken if the ticket key is compromised)
        ssl_session_cache   shared:SSL:10m;
        ssl_session_timeout 1d;
        ssl_session_tickets off;

        # ── [2] Content-Security-Policy ───────────────────────────────────────
        # Rationale:
        #   script-src 'unsafe-inline' — required by Next.js hydration runtime
        #   style-src  'unsafe-inline' — required by Tailwind CSS inline styles
        #   connect-src 'self'         — [12] API calls MUST stay on same origin;
        #                                     browser cannot exfiltrate data externally
        #   worker-src 'none'          — no service workers (reduces attack surface)
        #   frame-ancestors 'none'     — [3] same as X-Frame-Options: DENY
        #   object-src 'none'          — no Flash or plugins
        add_header Content-Security-Policy
            "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self'; worker-src 'none'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'; manifest-src 'self';"
            always;

        # ── [3] Clickjacking protection ───────────────────────────────────────
        add_header X-Frame-Options "DENY" always;

        # ── [4] MIME-type sniffing prevention ─────────────────────────────────
        add_header X-Content-Type-Options "nosniff" always;

        # ── [5] Referrer policy ───────────────────────────────────────────────
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;

        # ── [6] Disable dangerous browser APIs ───────────────────────────────
        add_header Permissions-Policy
            "camera=(), microphone=(), geolocation=(), payment=(), usb=(), interest-cohort=()"
            always;

        # Legacy XSS filter (belt-and-suspenders for older browsers)
        add_header X-XSS-Protection "1; mode=block" always;

        # ── [20] HSTS ─────────────────────────────────────────────────────────
        # max-age=31536000 = 1 year. Once sent, browsers will refuse HTTP for
        # this duration. Remove 'preload' until registered at hstspreload.org.
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;

        # ── [8] Block sensitive file access ───────────────────────────────────
        location ~ /\.(env|git|gitignore|dockerignore|htpasswd|ssh|aws|npmrc) {
            deny all;
            return 404;
        }
        location ~ /(\.venv|venv|__pycache__|node_modules|\.pytest_cache|htmlcov)/ {
            deny all;
            return 404;
        }
        location ~ \.(log|sql|bak|swp|orig)$ {
            deny all;
            return 404;
        }

        # ── [9] Block API schema exposure ─────────────────────────────────────
        # /docs and /redoc expose the full API surface to unauthenticated visitors.
        # Access them via: docker compose exec backend curl localhost:8000/docs
        location ~ ^/(docs|redoc|openapi\.json)$ {
            deny all;
            return 403;
        }

        # ── Health (passthrough — no rate limit, no access log) ───────────────
        location = /health {
            access_log off;
            proxy_pass         http://backend;
            proxy_set_header   Host $host;
            proxy_http_version 1.1;
        }

        # ── Auth endpoints (strict rate limit: 5 req/min, burst 3) ───────────
        location ~ ^/api/v1/auth/(login|register) {
            limit_req zone=auth_limit burst=3 nodelay;

            proxy_pass          http://backend;
            proxy_set_header    Host              $host;
            proxy_set_header    X-Real-IP         $remote_addr;
            proxy_set_header    X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header    X-Forwarded-Proto $scheme;
            proxy_http_version  1.1;
            proxy_read_timeout  30s;
            proxy_send_timeout  30s;
        }

        # ── API endpoints (rate limit: 30 req/min, burst 20) ─────────────────
        location /api/ {
            limit_req zone=api_limit burst=20 nodelay;

            proxy_pass          http://backend;
            proxy_set_header    Host              $host;
            proxy_set_header    X-Real-IP         $remote_addr;
            proxy_set_header    X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header    X-Forwarded-Proto $scheme;
            proxy_http_version  1.1;
            proxy_connect_timeout 10s;
            proxy_read_timeout    60s;
            proxy_send_timeout    60s;
        }

        # ── Frontend (Next.js) ────────────────────────────────────────────────
        location / {
            proxy_pass          http://frontend;
            proxy_set_header    Host              $host;
            proxy_set_header    X-Real-IP         $remote_addr;
            proxy_set_header    X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header    X-Forwarded-Proto $scheme;
            proxy_set_header    Upgrade           $http_upgrade;
            proxy_set_header    Connection        "upgrade";
            proxy_http_version  1.1;
            proxy_read_timeout  60s;
        }
    }
}
