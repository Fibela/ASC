# ─── ASC PremosCorp — Docker Compose (Production-mode) ───────────────────────
#
# Security model:
#   • Only nginx (ports 80 + 443) is reachable from the host.
#   • Port 80  → HTTP: redirects all traffic to HTTPS (301).
#   • Port 443 → HTTPS: TLS terminated at nginx with hardened ciphers.
#   • postgres, redis, backend, and frontend have NO host port exposure.
#   • All credentials are loaded from .env (never hardcoded here).
#   • SECRET_KEY has NO fallback — compose fails loudly if not set.
#   • Redis is password-protected (--requirepass).
#   • Each service runs as a non-root user (enforced in Dockerfiles).
#
# TLS certificates (P10):
#   Dev/staging:  scripts/gen_selfsigned_cert.sh  (or .ps1 on Windows)
#                 Place generated fullchain.pem + privkey.pem in infra/nginx/certs/
#   Production:   Use Let's Encrypt — see docs/TLS_SETUP.md
#
# Usage:
#   cp .env.example .env && $EDITOR .env   # fill in ALL required secrets
#   bash scripts/gen_selfsigned_cert.sh    # dev only — generates self-signed cert
#   docker compose up --build -d
#
# For local development (port exposure + hot-reload):
#   docker compose -f docker-compose.yml -f docker-compose.override.yml up --build
# ─────────────────────────────────────────────────────────────────────────────

version: '3.9'

# ── Networks ──────────────────────────────────────────────────────────────────
networks:
  asc_net:
    driver: bridge

# ── Volumes ───────────────────────────────────────────────────────────────────
volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local

# ── Services ──────────────────────────────────────────────────────────────────
services:

  # ── PostgreSQL ──────────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: asc_postgres
    restart: unless-stopped
    networks: [asc_net]
    environment:
      POSTGRES_DB:       ${POSTGRES_DB}
      POSTGRES_USER:     ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    # NO ports — postgres is NOT accessible from the host
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # ── Redis ───────────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: asc_redis
    restart: unless-stopped
    networks: [asc_net]
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD}
      --maxmemory 128mb
      --maxmemory-policy allkeys-lru
      --save ""
      --appendonly no
    volumes:
      - redis_data:/data
    # NO ports — redis is NOT accessible from the host
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s

  # ── Backend (FastAPI) ───────────────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: asc_backend:latest
    container_name: asc_backend
    restart: unless-stopped
    networks: [asc_net]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DATABASE_URL:       postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      REDIS_URL:          redis://:${REDIS_PASSWORD}@redis:6379/0
      SECRET_KEY:         ${SECRET_KEY}
      DEBUG:              "false"
      # Allow only the HTTPS nginx origin in production.
      # http://localhost retained for Docker internal health checks only.
      CORS_ORIGINS:       '["https://${DOMAIN:-localhost}","http://localhost"]'
      VIRUSTOTAL_API_KEY: ${VIRUSTOTAL_API_KEY:-}
      ABUSEIPDB_API_KEY:  ${ABUSEIPDB_API_KEY:-}
      OTXALIEN_API_KEY:   ${OTXALIEN_API_KEY:-}
    # NO ports — backend is NOT accessible from the host; all traffic via nginx
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  # ── Frontend (Next.js) ──────────────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # Empty string = relative URLs (/api/v1/...) proxied by nginx.
        # The browser never bypasses nginx to reach the backend directly.
        # nginx CSP (connect-src 'self') enforces this at the browser level.
        NEXT_PUBLIC_API_URL: ""
    image: asc_frontend:latest
    container_name: asc_frontend
    restart: unless-stopped
    networks: [asc_net]
    environment:
      NODE_ENV: production
    depends_on:
      backend:
        condition: service_healthy
    # NO ports — frontend is NOT accessible from the host; all traffic via nginx
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  # ── Celery Worker (async task executor — requires Redis) ────────────────────
  # Processes: escalation checks, SLA monitoring, scheduled reports, correlation.
  # Scale horizontally with: docker compose up --scale celery-worker=N
  celery-worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: asc_backend:latest
    container_name: asc_celery_worker
    restart: unless-stopped
    networks: [asc_net]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      backend:
        condition: service_healthy
    environment:
      DATABASE_URL:       postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      REDIS_URL:          redis://:${REDIS_PASSWORD}@redis:6379/0
      SECRET_KEY:         ${SECRET_KEY}
      DEBUG:              "false"
      CORS_ORIGINS:       '["https://${DOMAIN:-localhost}"]'
    command:
      - celery
      - -A
      - app.tasks.celery_app
      - worker
      - --loglevel=info
      - --queues=default
      - --concurrency=2          # 2 threads: safe for async DB workloads
      - --max-tasks-per-child=100  # restart worker after 100 tasks (memory safety)
    # NO ports — worker communicates only with Redis/Postgres on asc_net
    healthcheck:
      test: ["CMD-SHELL", "celery -A app.tasks.celery_app inspect ping -d celery@$$HOSTNAME --timeout=5 2>/dev/null || exit 1"]
      interval: 30s
      timeout: 15s
      retries: 3
      start_period: 60s

  # ── Celery Beat (periodic task scheduler — single instance) ─────────────────
  # Only ONE beat instance per deployment — multiple beats cause duplicate tasks.
  # Beat uses Redis as message broker; tasks are executed by celery-worker.
  celery-beat:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: asc_backend:latest
    container_name: asc_celery_beat
    restart: unless-stopped
    networks: [asc_net]
    depends_on:
      redis:
        condition: service_healthy
      celery-worker:
        condition: service_started
    environment:
      DATABASE_URL:       postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      REDIS_URL:          redis://:${REDIS_PASSWORD}@redis:6379/0
      SECRET_KEY:         ${SECRET_KEY}
      DEBUG:              "false"
    command:
      - celery
      - -A
      - app.tasks.celery_app
      - beat
      - --loglevel=info
      - --scheduler=celery.beat:PersistentScheduler  # persists schedule across restarts
      - --pidfile=/tmp/celerybeat.pid
    # NO ports — beat communicates only with Redis on asc_net
    healthcheck:
      test: ["CMD", "test", "-f", "/tmp/celerybeat.pid"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  # ── Nginx (Public Gateway + Security Layer) ─────────────────────────────────
  # The ONLY service with a host port.
  # Applies: CSP, X-Frame-Options, rate limiting, path blocking.
  # Routes: /api/ → backend | /* → frontend
  nginx:
    image: nginx:1.27-alpine
    container_name: asc_nginx
    restart: unless-stopped
    networks: [asc_net]
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_started
    ports:
      - "80:80"    # HTTP — redirects all traffic to HTTPS (see nginx.conf)
      - "443:443"  # HTTPS — TLS terminated here with ciphers in nginx.conf
    volumes:
      - ./infra/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      # TLS certificates (never committed to git — see infra/nginx/certs/.gitignore)
      # Dev: run scripts/gen_selfsigned_cert.sh to generate fullchain.pem + privkey.pem
      # Prod: place Let's Encrypt certs here (see docs/TLS_SETUP.md)
      - ./infra/nginx/certs:/etc/nginx/certs:ro
      # Let's Encrypt ACME challenge webroot (for certbot cert renewal)
      # Uncomment when using certbot for automated cert renewal:
      # - ./infra/nginx/certbot-webroot:/var/www/certbot:ro
    healthcheck:
      # Checks nginx over HTTP port 80. The /health location in the HTTP block
      # bypasses the HTTPS redirect and proxies to backend — no cert required.
      test: ["CMD", "wget", "-qO-", "http://localhost/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s
